# EstateAI Nginx Configuration for AWS EC2
# Put this in /etc/nginx/sites-available/estateai and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _; # Replace with your EC2 Public DNS or custom domain

    # Frontend static files (built with `npm run build`)
    root /var/www/estateai/frontend/dist;
    index index.html;

    # Gzip compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Single-Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend FastAPI API reverse proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        client_max_body_size 50M; # Support brochure/PDF uploads
    }

    # Health check proxy
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets uploaded or served by backend
    location /static/ {
        alias /var/www/estateai/backend/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
